<!DOCTYPE html>
<html lang="ru">
<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'main.css' %}">
    <meta charset="UTF-8">
    <title>{% block title %}Cамолёты России{% endblock %}</title>
</head>
<body>
    <header>
        <h1>Самолёты России</h1>
        <nav>
            <a href="/">Главная</a> |
            <a href="/about/">О сайте</a> |
            <a href="/contact/">Обратная связь</a>
            {% if user.is_staff %}
            <a href="{% url 'admin_messages' %}">Сообщения</a> |
            {% endif %}
            {% if user.is_authenticated %}
            <a href="{% url 'logout' %}">Выйти</a>
            {% else %}
            <a href="{% url 'login' %}">Войти</a>
            {% endif %}
        </nav>
    </header>

<main>
    <div class="content-wrapper">
        {% block content %}{% endblock %}
    </div>
</main>

    <footer>
        <hr>
        <p> 2025 Язев Г.А.</p>
    </footer>
</body>
</html>
